<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>BNN Save Editor</title>
    <style>
        body {
            background: #0a0014;
            color: #fff;
            font-family: "Segoe UI", sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-shadow: 0 0 10px #a200ff;
        }
        textarea {
            width: 90%;
            max-width: 800px;
            height: 200px;
            background: #120022;
            color: #fff;
            border: 1px solid #a200ff;
            border-radius: 8px;
            padding: 10px;
            font-size: 1rem;
        }
        .buttons {
            margin-top: 15px;
        }
        button {
            margin: 5px;
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }
        .save-btn {
            background: #a200ff;
            color: #fff;
        }
        .delete-btn {
            background: #ff0044;
            color: #fff;
        }
        .status {
            margin-top: 10px;
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>

<h1>BNN Save Editor</h1>

<textarea id="editor" placeholder="ここにテキストを書いて保存できます"></textarea>

<div class="buttons">
    <button class="save-btn" onclick="saveData()">保存（上書き）</button>
    <button class="delete-btn" onclick="deleteData()">削除</button>
</div>

<div class="status" id="status"></div>

<script>
    const KEY = "BNN_SAVE_DATA";

    // ページ読み込み時に保存済みデータを読み込む
    window.addEventListener("load", () => {
        const saved = localStorage.getItem(KEY);
        if (saved !== null) {
            document.getElementById("editor").value = saved;
            document.getElementById("status").textContent = "保存済みデータを読み込みました。";
        } else {
            document.getElementById("status").textContent = "まだ保存されているデータはありません。";
        }
    });

    // 保存（上書き）
    function saveData() {
        const text = document.getElementById("editor").value;
        localStorage.setItem(KEY, text);
        document.getElementById("status").textContent = "データを保存しました。（上書き完了）";
    }

    // 削除
    function deleteData() {
        localStorage.removeItem(KEY);
        document.getElementById("editor").value = "";
        document.getElementById("status").textContent = "保存データを削除しました。";
    }
</script>

</body>
</html>
